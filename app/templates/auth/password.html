{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block heading %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:480px"><div class="card-body">
<form method="post">
  <div class="mb-3"><label class="form-label">Current password</label><input type="password" class="form-control" name="current" required></div>
  <div class="mb-3"><label class="form-label">New password</label><input type="password" class="form-control" name="new" minlength="6" required></div>
  <div class="mb-3"><label class="form-label">Confirm new password</label><input type="password" class="form-control" name="confirm" required></div>
  <button class="btn btn-primary">Update password</button>
</form></div></div>
{% endblock %}
