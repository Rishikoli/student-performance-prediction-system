{% extends 'base.html' %}
{% block title %}User{% endblock %}
{% block heading %}{{ 'Edit user' if user else 'New staff user' }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px"><div class="card-body">
<form method="post">
  <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ request.form.username or (user.username if user else '') }}" required></div>
  <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ request.form.full_name or (user.full_name if user else '') }}" required></div>
  {% if not user or user.role != 'student' %}
  <div class="mb-3"><label class="form-label">Role</label>
    <select class="form-select" name="role" id="role">
      {% for r in ['teacher', 'admin'] %}<option value="{{ r }}" {% if (request.form.role or (user.role if user else 'teacher')) == r %}selected{% endif %}>{{ r|title }}</option>{% endfor %}
    </select></div>
  <div class="mb-3" id="subjWrap"><label class="form-label">Subject (teachers)</label>
    <select class="form-select" name="subject_id">
      {% for s in subjects %}<option value="{{ s.id }}" {% if user and user.subject_id == s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
    </select></div>
  {% else %}<input type="hidden" name="role" value="student">{% endif %}
  <div class="mb-3"><label class="form-label">Password {% if user %}<span class="text-secondary small">(leave blank to keep)</span>{% endif %}</label>
    <input type="password" class="form-control" name="password" {% if not user %}required minlength="6"{% endif %}></div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{{ url_for('admin.users') }}">Cancel</a>
</form></div></div>
{% endblock %}
{% block scripts %}<script>
const role = document.getElementById('role');
if (role) { const f = () => subjWrap.style.display = role.value === 'teacher' ? '' : 'none'; role.onchange = f; f(); }
</script>{% endblock %}
